<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>صندوق الأخبار — الميديا المركزية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#0da0de; --sky-deep:#075a8c; --sky-mid:#0b7cc0;
  --bg:#f2f9fd; --card:#ffffff; --text:#0e2a3d; --muted:#54738a; --border:#d3e9f5;
}
*{box-sizing:border-box; margin:0; padding:0; font-family:'Cairo',sans-serif;}
body{background:var(--bg); color:var(--text); min-height:100vh;}
.hero{
  background:linear-gradient(165deg,var(--sky-deep),var(--sky-mid) 55%,var(--sky));
  color:#fff; padding:26px 20px 46px; text-align:center; position:relative;
}
.hero::after{content:''; position:absolute; inset:auto 0 0 0; height:6px; background:rgba(255,255,255,.85);}
.hero h1{font-size:1.3rem; font-weight:900;}
.hero .logo-badge{display:inline-flex; align-items:center; justify-content:center; background:#fff; border-radius:18px; padding:10px 20px; margin:0 auto 10px; box-shadow:0 6px 18px rgba(4,50,80,.35);}
.hero .logo-badge img{height:60px; display:block;}
.hero p{opacity:.9; font-size:.88rem; margin-top:4px;}
.wrap{max-width:640px; margin:-28px auto 40px; padding:0 16px; position:relative; z-index:1;}
.card{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:20px 16px; box-shadow:0 10px 30px rgba(11,92,173,.09);}
label{display:block; font-weight:700; font-size:.95rem; margin-bottom:8px;}
input{width:100%; padding:13px 14px; border:1.5px solid var(--border); border-radius:12px; font-size:1rem; font-family:inherit; background:#fbfdff;}
input:focus{outline:none; border-color:var(--sky); box-shadow:0 0 0 3px rgba(13,160,222,.15); background:#fff;}
.btn{width:100%; margin-top:14px; padding:14px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--sky),var(--sky-deep)); color:#fff; font-size:1.05rem; font-weight:900; font-family:inherit; cursor:pointer;}
.btn:active{transform:scale(.98);}
.err{color:#d32f2f; font-size:.85rem; font-weight:700; margin-top:10px; display:none;}
.stats{display:none; gap:10px; margin-bottom:16px;}
.stats.show{display:flex;}
.stat{flex:1; background:#ecf7fd; border:1px solid var(--border); border-radius:12px; padding:10px; text-align:center;}
.stat b{display:block; color:var(--sky-deep); font-size:1.3rem; font-weight:900;}
.stat span{font-size:.78rem; color:var(--muted);}
.sub{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 4px 14px rgba(11,92,173,.06);}
.sub .top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
.badge{background:linear-gradient(135deg,var(--sky),var(--sky-deep)); color:#fff; border-radius:99px; padding:3px 12px; font-size:.8rem; font-weight:700; white-space:nowrap;}
.when{color:var(--muted); font-size:.78rem;}
.sub h3{font-size:1.08rem; margin:10px 0 4px; font-weight:900;}
.meta{color:var(--muted); font-size:.88rem; line-height:1.7;}
.meta b{color:var(--text);}
.notes{background:#fffbea; border:1px solid #efe3b8; border-radius:10px; padding:8px 12px; font-size:.86rem; margin-top:8px;}
.thumbs{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
.thumbs a{display:block; border-radius:10px; overflow:hidden; border:1px solid var(--border); aspect-ratio:1; background:#eef3fa; position:relative;}
.thumbs img{width:100%; height:100%; object-fit:cover; display:block;}
.thumbs .vid{display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:var(--sky-deep); height:100%;}
.empty{text-align:center; color:var(--muted); padding:30px 0; display:none;}
.refresh{margin-top:4px; background:none; border:1.5px solid var(--sky); color:var(--sky-deep); border-radius:12px; padding:10px; width:100%; font-family:inherit; font-weight:700; cursor:pointer;}
footer{text-align:center; color:var(--muted); font-size:.8rem; padding:6px 0 26px;}
</style>
</head>
<body>
<header class="hero">
  <div class="logo-badge"><img src="logo-activity.png" alt="إنقاذ حياة مريض — قوافل طبية"></div>
  <h1>صندوق أخبار الفروع</h1>
  <p>خاص بالميديا المركزية</p>
</header>
<div class="wrap">
  <div class="card" id="gate">
    <label>كود الدخول</label>
    <input id="code" type="password" inputmode="text" placeholder="اكتب الكود">
    <div class="err" id="err">الكود غلط، جرب تاني</div>
    <button class="btn" id="open">فتح الصندوق</button>
  </div>

  <div id="box" style="display:none">
    <div class="stats" id="stats">
      <div class="stat"><b id="stCount">0</b><span>خبر</span></div>
      <div class="stat"><b id="stBen">0</b><span>مستفيد</span></div>
      <div class="stat"><b id="stBranches">0</b><span>فرع</span></div>
    </div>
    <div id="list"></div>
    <div class="empty" id="empty">مفيش أخبار لسه.</div>
    <button class="refresh" id="refresh">تحديث</button>
  </div>
  <footer>القوافل الطبية — الميديا المركزية</footer>
</div>

<script>
const SUPA_URL = 'https://oybknupfuaveaznzrdqi.supabase.co';
const SUPA_KEY = 'sb_publishable_csnN7BXoLEk-0s8CYCuRJg_hRYfQrbw';
const $ = id => document.getElementById(id);
let code = localStorage.getItem('media_inbox_code') || '';

function pubUrl(path){ return `${SUPA_URL}/storage/v1/object/public/media-uploads/${path}`; }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('ar-EG',{weekday:'long', day:'numeric', month:'long', year:'numeric'}); }
function fmtWhen(ts){ return new Date(ts).toLocaleString('ar-EG',{day:'numeric', month:'short', hour:'numeric', minute:'2-digit'}); }

async function load(){
  const res = await fetch(`${SUPA_URL}/rest/v1/rpc/get_media_submissions`, {
    method:'POST',
    headers:{ apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}`, 'Content-Type':'application/json' },
    body: JSON.stringify({ p_code: code })
  });
  if(!res.ok) throw new Error('bad code');
  return res.json();
}

function render(rows){
  $('stats').classList.add('show');
  $('stCount').textContent = rows.length;
  $('stBen').textContent = rows.reduce((s,r)=>s+(r.beneficiaries||0),0).toLocaleString('ar-EG');
  $('stBranches').textContent = new Set(rows.map(r=>r.branch)).size;
  const list = $('list'); list.innerHTML = '';
  $('empty').style.display = rows.length ? 'none' : 'block';
  for(const r of rows){
    const div = document.createElement('div');
    div.className = 'sub';
    const files = (r.files||[]);
    const thumbs = files.map(f => {
      const u = pubUrl(f.path);
      const isVid = (f.type||'').startsWith('video');
      return `<a href="${u}" target="_blank" rel="noopener">${isVid ? '<span class="vid">🎬</span>' : `<img loading="lazy" src="${u}" alt="">`}</a>`;
    }).join('');
    div.innerHTML = `
      <div class="top"><span class="badge">${r.branch}</span>${r.event_type ? `<span class="badge" style="background:#075A8C">${r.event_type}</span>` : ''}<span class="when">${fmtWhen(r.created_at)}</span></div>
      <h3>${r.convoy_name}</h3>
      <div class="meta">📍 <b>${r.place}</b><br>🗓️ ${fmtDate(r.convoy_date)}<br>👥 المستفيدين: <b>${(r.beneficiaries??'—').toLocaleString? r.beneficiaries.toLocaleString('ar-EG') : r.beneficiaries}</b></div>
      ${r.notes ? `<div class="notes">${r.notes}</div>` : ''}
      <div class="thumbs">${thumbs}</div>`;
    list.appendChild(div);
  }
}

async function open(){
  $('err').style.display = 'none';
  try{
    const rows = await load();
    localStorage.setItem('media_inbox_code', code);
    $('gate').style.display = 'none';
    $('box').style.display = 'block';
    render(rows);
  }catch(e){
    $('err').style.display = 'block';
  }
}

$('open').addEventListener('click', () => { code = $('code').value.trim(); open(); });
$('code').addEventListener('keydown', e => { if(e.key==='Enter'){ code = $('code').value.trim(); open(); } });
$('refresh').addEventListener('click', async () => { render(await load()); });
if(code){ $('code').value = code; open(); }
</script>
</body>
</html>
