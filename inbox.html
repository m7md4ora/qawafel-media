<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>صندوق الأخبار — الميديا المركزية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171233; --violet:#7c3aed; --violet-deep:#4c1d95; --fuchsia:#c026d3;
  --amber:#fbbf24; --amber-deep:#f59e0b;
  --bg:#f4f3fb; --card:#ffffff; --text:#231c42; --muted:#6d6789;
  --border:#e3def3; --ok:#16a34a; --red:#dc2626;
}
*{box-sizing:border-box; margin:0; padding:0; font-family:'Cairo',sans-serif;}
body{background:var(--bg); color:var(--text); min-height:100vh;}
.hero{
  background:
    radial-gradient(600px 260px at 88% -8%, rgba(192,38,211,.30), transparent 65%),
    linear-gradient(160deg,#171233 0%, var(--violet-deep) 48%, var(--violet) 100%);
  color:#fff; padding:40px 20px 64px; text-align:center; position:relative; overflow:hidden;
}
.hero::after{content:''; position:absolute; inset:auto 0 0 0; height:5px; background:linear-gradient(90deg,var(--fuchsia),#e9d5ff,var(--fuchsia));}
.deco{position:absolute; inset:0; pointer-events:none;}
.deco svg{position:absolute; color:#fff; opacity:.13;}
.deco .d1{top:10%; right:6%; width:46px;}
.deco .d2{top:16%; left:6%; width:36px;}
.deco .d3{bottom:26%; right:11%; width:32px;}
.deco .d4{bottom:30%; left:9%; width:42px;}
.logos{display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:16px; position:relative; animation:logoIn .6s ease-out both;}
@keyframes logoIn{from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:none}}
.logos img{height:58px; display:block;}
.logos .sep{width:1.5px; height:44px; background:linear-gradient(180deg,transparent,rgba(255,255,255,.65),transparent);}
.hero h1{font-size:1.5rem; font-weight:900; letter-spacing:.2px; position:relative;}
.hero .subtitle{color:#e9d5ff; font-weight:700; font-size:.98rem; margin-top:4px; position:relative;}
.hero p{opacity:.88; font-size:.9rem; margin-top:8px; position:relative;}
@keyframes pop{from{transform:scale(.4); opacity:0} to{transform:scale(1); opacity:1}}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important; transition:none !important;} }

.hero{padding:32px 20px 52px;}
.logos img{height:50px;}
.hero h1{font-size:1.35rem;}
.wrap{max-width:640px; margin:-30px auto 40px; padding:0 16px; position:relative; z-index:1;}
.card{background:var(--card); border:1px solid var(--border); border-radius:20px; padding:20px 16px; box-shadow:0 4px 14px rgba(76,29,149,.12);}
label{display:block; font-weight:700; font-size:.95rem; margin-bottom:8px;}
input{width:100%; padding:13px 14px; border:1.5px solid var(--border); border-radius:12px; font-size:1rem; font-family:inherit; background:#fbfaff; color:var(--text);}
input:focus{outline:none; border-color:var(--violet); box-shadow:0 0 0 3px rgba(124,58,237,.16); background:#fff;}
.btn{width:100%; margin-top:14px; padding:14px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--violet),var(--fuchsia)); color:#fff; font-size:1.05rem; font-weight:900; font-family:inherit; cursor:pointer; box-shadow:0 3px 10px rgba(124,58,237,.28);}
.btn:active{transform:scale(.98);}
.err{color:var(--red); font-size:.85rem; font-weight:700; margin-top:10px; display:none;}
.stats{display:none; gap:10px; margin-bottom:16px;}
.stats.show{display:flex;}
.stat{flex:1; background:#f3efff; border:1px solid var(--border); border-radius:12px; padding:10px; text-align:center;}
.stat b{display:block; color:var(--violet-deep); font-size:1.3rem; font-weight:900;}
.stat span{font-size:.78rem; color:var(--muted);}
.sub{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(76,29,149,.08);}
.sub .top{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
.badge{background:linear-gradient(135deg,var(--violet),var(--violet-deep)); color:#fff; border-radius:99px; padding:3px 12px; font-size:.8rem; font-weight:700; white-space:nowrap;}
.when{color:var(--muted); font-size:.78rem;}
.sub h3{font-size:1.08rem; margin:10px 0 4px; font-weight:900;}
.meta{color:var(--muted); font-size:.88rem; line-height:1.7;}
.meta b{color:var(--text);}
.notes{background:#fffbea; border:1px solid #efe3b8; border-radius:10px; padding:8px 12px; font-size:.86rem; margin-top:8px;}
.thumbs{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
.thumbs a{display:block; border-radius:10px; overflow:hidden; border:1px solid var(--border); aspect-ratio:1; background:#f0ecf9; position:relative;}
.thumbs img{width:100%; height:100%; object-fit:cover; display:block;}
.thumbs .vid{display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:var(--violet-deep); height:100%;}
.empty{text-align:center; color:var(--muted); padding:30px 0; display:none;}
.refresh{margin-top:4px; background:none; border:1.5px solid var(--violet); color:var(--violet-deep); border-radius:12px; padding:10px; width:100%; font-family:inherit; font-weight:700; cursor:pointer;}
footer{text-align:center; color:var(--muted); font-size:.8rem; padding:6px 0 26px;}
</style>
</head>
<body>
<header class="hero">
  <div class="deco"><svg class="d1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg> <svg class="d2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg> <svg class="d3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z" fill="currentColor" stroke="none"/></svg> <svg class="d4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/></svg></div>
  <div class="logos"><img src="logo-ihna-white-small.png" alt="إحنا"><span class="sep"></span><img src="logo-convoys-white-small.png" alt="رسالة — قوافل طبية"></div>
  <h1>صندوق أخبار الفروع</h1>
  <div class="subtitle">لجنة الميديا المركزية</div>
  <p>الأخبار الواصلة من كل الفروع</p>
</header>
<div class="wrap">
  <div class="card" id="gate">
    <label>كود الدخول</label>
    <input id="code" type="password" inputmode="text" placeholder="اكتب الكود">
    <div class="err" id="err">الكود غلط، جرب تاني</div>
    <button class="btn" id="open">فتح الصندوق</button>
  </div>

  <div id="box" style="display:none">
    <div class="stats" id="stats">
      <div class="stat"><b id="stCount">0</b><span>خبر</span></div>
      <div class="stat"><b id="stBen">0</b><span>مستفيد</span></div>
      <div class="stat"><b id="stBranches">0</b><span>فرع</span></div>
    </div>
    <div id="list"></div>
    <div class="empty" id="empty">مفيش أخبار لسه.</div>
    <button class="refresh" id="refresh">تحديث</button>
  </div>
  <footer>نشاط القوافل الطبية - لجنة الميديا المركزية</footer>
</div>

<script>
const SUPA_URL = 'https://oybknupfuaveaznzrdqi.supabase.co';
const SUPA_KEY = 'sb_publishable_csnN7BXoLEk-0s8CYCuRJg_hRYfQrbw';
const $ = id => document.getElementById(id);
let code = localStorage.getItem('media_inbox_code') || '';

function pubUrl(path){ return `${SUPA_URL}/storage/v1/object/public/media-uploads/${path}`; }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('ar-EG',{weekday:'long', day:'numeric', month:'long', year:'numeric'}); }
function fmtWhen(ts){ return new Date(ts).toLocaleString('ar-EG',{day:'numeric', month:'short', hour:'numeric', minute:'2-digit'}); }

async function load(){
  const res = await fetch(`${SUPA_URL}/rest/v1/rpc/get_media_submissions`, {
    method:'POST',
    headers:{ apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}`, 'Content-Type':'application/json' },
    body: JSON.stringify({ p_code: code })
  });
  if(!res.ok) throw new Error('bad code');
  return res.json();
}

function render(rows){
  $('stats').classList.add('show');
  $('stCount').textContent = rows.length;
  $('stBen').textContent = rows.reduce((s,r)=>s+(r.beneficiaries||0),0).toLocaleString('ar-EG');
  $('stBranches').textContent = new Set(rows.map(r=>r.branch)).size;
  const list = $('list'); list.innerHTML = '';
  $('empty').style.display = rows.length ? 'none' : 'block';
  for(const r of rows){
    const div = document.createElement('div');
    div.className = 'sub';
    const files = (r.files||[]);
    const thumbs = files.map(f => {
      const u = pubUrl(f.path);
      const isVid = (f.type||'').startsWith('video');
      return `<a href="${u}" target="_blank" rel="noopener">${isVid ? '<span class="vid">🎬</span>' : `<img loading="lazy" src="${u}" alt="">`}</a>`;
    }).join('');
    div.innerHTML = `
      <div class="top"><span class="badge">${r.branch}</span>${r.event_type ? `<span class="badge" style="background:linear-gradient(135deg,#c026d3,#7c3aed)">${r.event_type}</span>` : ''}<span class="when">${fmtWhen(r.created_at)}</span></div>
      <h3>${r.convoy_name}</h3>
      <div class="meta">✍️ مسلّم الخبر: <b>${r.submitter_name||'—'}</b><br>📍 <b>${r.place}</b><br>🗓️ ${fmtDate(r.convoy_date)}<br>👥 المستفيدين: <b>${(r.beneficiaries??'—').toLocaleString? r.beneficiaries.toLocaleString('ar-EG') : r.beneficiaries}</b></div>
      ${r.notes ? `<div class="notes">${r.notes}</div>` : ''}
      ${r.drive_url ? `<a class="drv" href="${r.drive_url}" target="_blank" rel="noopener" style="display:inline-block;margin-top:10px;padding:10px 16px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;font-weight:700;text-decoration:none">📁 فتح الصور والفيديوهات في Drive</a>` : ''}
      <div class="thumbs">${thumbs}</div>`;
    list.appendChild(div);
  }
}

async function open(){
  $('err').style.display = 'none';
  try{
    const rows = await load();
    localStorage.setItem('media_inbox_code', code);
    $('gate').style.display = 'none';
    $('box').style.display = 'block';
    render(rows);
  }catch(e){
    $('err').style.display = 'block';
  }
}

$('open').addEventListener('click', () => { code = $('code').value.trim(); open(); });
$('code').addEventListener('keydown', e => { if(e.key==='Enter'){ code = $('code').value.trim(); open(); } });
$('refresh').addEventListener('click', async () => { render(await load()); });
if(code){ $('code').value = code; open(); }
</script>
</body>
</html>
